<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pré-Jogo | Market Monitor PRO</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .nav-links {
            display: flex;
            gap: 1.5rem;
            margin-top: 1rem;
        }
        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            padding: 8px 16px;
            border-radius: 8px;
            transition: all 0.2s;
        }
        .nav-links a:hover {
            color: var(--neon-blue);
            background: rgba(0, 229, 255, 0.1);
        }
        .nav-links a.active {
            color: var(--neon-blue);
            background: rgba(0, 229, 255, 0.1);
        }
        .prematch-card {
            border-top: 4px solid var(--text-muted);
        }
        .prematch-card.excelente { border-top-color: var(--neon-green); }
        .prematch-card.boa { border-top-color: #00B0FF; }
        .prematch-card.risco { border-top-color: var(--alert-red); }
        
        .rec-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 700;
            margin-top: 10px;
            background: rgba(255,255,255,0.1);
        }
        .excelente .rec-badge { background: rgba(0, 255, 136, 0.2); color: var(--neon-green); }
        .boa .rec-badge { background: rgba(0, 176, 255, 0.2); color: #00B0FF; }
        .risco .rec-badge { background: rgba(255, 51, 102, 0.2); color: var(--alert-red); }
        
        .avisos-list {
            margin-top: 15px;
            font-size: 0.75rem;
            color: #ffaa00;
            background: rgba(255, 170, 0, 0.1);
            padding: 10px;
            border-radius: 6px;
        }
        .advanced-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid var(--glass-border);
        }
        .radar-container {
            position: relative;
            height: 180px;
            width: 100%;
        }
        .intervals-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
            justify-content: center;
        }
        .interval-bar-bg {
            background: rgba(255,255,255,0.05);
            height: 12px;
            border-radius: 6px;
            width: 100%;
            overflow: hidden;
            position: relative;
        }
        .interval-bar-fill {
            height: 100%;
            background: var(--neon-blue);
            border-radius: 6px;
        }
        .interval-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
            margin-bottom: 2px;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="glass-header" style="flex-direction: column; align-items: flex-start;">
            <div style="display: flex; justify-content: space-between; width: 100%;">
                <div class="logo">
                    <span class="neon-dot"></span>
                    <h1>Market Monitor PRO</h1>
                </div>
            </div>
            <nav class="nav-links">
                <a href="/">🔴 Ao Vivo (Radar)</a>
                <a href="/pre-jogo" class="active">📅 Radar Pré-Jogo</a>
                <a href="/banca">💰 Gestão de Banca</a>
            </nav>
        </header>

        <!-- Main Content -->
        <main>
            <div class="section-title">
                <h2>Oportunidades do Dia (Over 0.5 HT)</h2>
                <div style="display:flex; gap:10px; align-items:center;">
                    <div class="pulse-indicator" style="border-color: var(--neon-green); color: var(--neon-green);">
                        <span class="source-badge hybrid">ESPN + SofaScore</span>
                        <span id="update-time">Calculando...</span>
                    </div>
                    <button onclick="triggerRefresh()" id="refresh-btn" style="background:transparent; border:1px solid var(--neon-blue); color:var(--neon-blue); padding:6px 14px; border-radius:8px; cursor:pointer; font-size:0.85rem;">&#x21bb; Atualizar Jogos</button>
                </div>
            </div>
            
            <div class="matches-grid" id="prematch-grid">
                <div class="loading-state">Calculando H2H, xG e Forma dos times...</div>
            </div>
        </main>
    </div>

    <script>
        async function fetchPrematch() {
            try {
                const response = await fetch('/api/prematch_data');
                const data = await response.json();
                const grid = document.getElementById('prematch-grid');

                // Update timestamp
                if (data.updated_at) {
                    document.getElementById('update-time').innerText = 'Atualizado ' + data.updated_at;
                }

                if (data.loading) {
                    grid.innerHTML = '<div class="loading-state">&#x23F3; Buscando jogos reais e calculando forma... (pode levar ~30s)</div>';
                    setTimeout(fetchPrematch, 5000); // keep polling
                    return;
                }

                if (!data.matches || data.matches.length === 0) {
                    grid.innerHTML = '<div class="empty-state">Nenhum jogo encontrado para hoje. Clique em Atualizar Jogos.</div>';
                    return;
                }

                grid.innerHTML = '';
                data.matches.forEach((match, index) => {
                
                data.matches.forEach((match, index) => {
                    let cardClass = 'risco';
                    if (match.recomendacao.includes('EXCELENTE')) cardClass = 'excelente';
                    else if (match.recomendacao.includes('BOA') || match.recomendacao.includes('CONSIDERAR')) cardClass = 'boa';
                    
                    const avisosHtml = match.avisos && match.avisos.length > 0 
                        ? `<div class="avisos-list">${match.avisos.map(a => `<div>${a}</div>`).join('')}</div>`
                        : '';
                        
                    const card = document.createElement('div');
                    card.className = `match-card glass-panel prematch-card ${cardClass}`;
                    const leagueBadge = match.league ? `<span class="source-badge basic">${match.league}</span>` : '';
                    card.innerHTML = `
                        <div class="card-header">
                            <span class="competition">${match.time}</span>
                            <div class="card-badges">
                                ${leagueBadge}
                                <span class="source-badge hybrid">Pré-Jogo</span>
                            </div>
                        </div>
                        <div class="teams-score">
                            <div class="team">${match.home}</div>
                            <div class="score">vs</div>
                            <div class="team">${match.away}</div>
                        </div>
                        
                        <div class="metrics-grid" style="grid-template-columns: 1fr 1fr 1fr;">
                            <div class="metric">
                                <span class="m-label">Score Geral</span>
                                <span class="m-value ${cardClass === 'excelente' ? 'neon-text' : ''}">${match.score.toFixed(1)}</span>
                            </div>
                            <div class="metric">
                                <span class="m-label">Prob. Over HT</span>
                                <span class="m-value">${(match.prob_ht * 100).toFixed(1)}%</span>
                            </div>
                            <div class="metric">
                                <span class="m-label">Stake Recomendada</span>
                                <span class="m-value neon-text">R$ ${match.stake_recomendada.toFixed(2)}</span>
                            </div>
                        </div>
                        
                        <div style="text-align: center;">
                            <span class="rec-badge">${match.recomendacao}</span>
                            ${match.stake_recomendada > 0 ? `<button onclick="registrarAposta('${match.home} vs ${match.away}', ${match.odd_estimada}, ${match.stake_recomendada})" style="margin-left: 10px; background: var(--neon-green); color: #000; border: none; padding: 4px 10px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 0.75rem;">+ Registrar Aposta</button>` : ''}
                        </div>
                        
                        <div class="advanced-stats">
                            <div class="radar-container">
                                <canvas id="radar-${index}"></canvas>
                            </div>
                            <div class="intervals-container">
                                <span class="m-label" style="text-align: center; margin-bottom: 5px;">🔥 Probabilidade de Gols no HT</span>
                                <div>
                                    <div class="interval-label"><span>0 - 15 min</span> <span>${match.intervals['0_15']}%</span></div>
                                    <div class="interval-bar-bg"><div class="interval-bar-fill" style="width: ${match.intervals['0_15']}%; background: rgba(0, 229, 255, 0.5);"></div></div>
                                </div>
                                <div>
                                    <div class="interval-label"><span>15 - 30 min</span> <span>${match.intervals['15_30']}%</span></div>
                                    <div class="interval-bar-bg"><div class="interval-bar-fill" style="width: ${match.intervals['15_30']}%; background: rgba(0, 229, 255, 0.7);"></div></div>
                                </div>
                                <div>
                                    <div class="interval-label"><span>30 - 45+ min</span> <span style="color: var(--neon-green)">${match.intervals['30_45']}%</span></div>
                                    <div class="interval-bar-bg"><div class="interval-bar-fill" style="width: ${match.intervals['30_45']}%; background: var(--neon-green);"></div></div>
                                </div>
                            </div>
                        </div>

                        ${avisosHtml}
                    `;
                    grid.appendChild(card);
                    
                    // Render Radar Chart
                    const ctx = document.getElementById(`radar-${index}`).getContext('2d');
                    new Chart(ctx, {
                        type: 'radar',
                        data: {
                            labels: match.radar.labels,
                            datasets: [{
                                label: match.home,
                                data: match.radar.home,
                                backgroundColor: 'rgba(0, 255, 136, 0.2)',
                                borderColor: '#00ff88',
                                pointBackgroundColor: '#00ff88',
                                borderWidth: 2,
                            }, {
                                label: match.away,
                                data: match.radar.away,
                                backgroundColor: 'rgba(255, 51, 102, 0.2)',
                                borderColor: '#ff3366',
                                pointBackgroundColor: '#ff3366',
                                borderWidth: 2,
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            scales: {
                                r: {
                                    angleLines: { color: 'rgba(255, 255, 255, 0.1)' },
                                    grid: { color: 'rgba(255, 255, 255, 0.1)' },
                                    pointLabels: { color: '#8b9bb4', font: { size: 9, family: 'Inter' } },
                                    ticks: { display: false, min: 0, max: 100 }
                                }
                            },
                            plugins: {
                                legend: { display: false }
                            }
                        }
                    });
                });
            } catch (error) {
                console.error("Erro:", error);
            }
        }

        async function registrarAposta(partida, odd, stake) {
            if(confirm(`Registrar aposta na partida ${partida} com Stake de R$ ${stake}?`)) {
                await fetch('/api/banca/apostar', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        partida: partida,
                        mercado: "Over 0.5 HT",
                        odd: odd,
                        stake: stake
                    })
                });
                alert("Aposta registrada com sucesso na sua Banca!");
            }
        }

        async function triggerRefresh() {
            const btn = document.getElementById('refresh-btn');
            btn.innerText = 'Atualizando...';
            btn.disabled = true;
            document.getElementById('update-time').innerText = 'Calculando...';
            document.getElementById('prematch-grid').innerHTML = '<div class="loading-state">&#x23F3; Buscando jogos do dia e analisando forma...</div>';
            await fetch('/api/prematch_refresh');
            setTimeout(() => {
                fetchPrematch();
                btn.innerText = '&#x21bb; Atualizar Jogos';
                btn.disabled = false;
            }, 35000); // wait 35s for background job
        }

        fetchPrematch();
    </script>
</body>
</html>
