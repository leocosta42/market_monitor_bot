<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banca | Market Monitor PRO</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .nav-links {
            display: flex;
            gap: 1.5rem;
            margin-top: 1rem;
        }
        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            padding: 8px 16px;
            border-radius: 8px;
            transition: all 0.2s;
        }
        .nav-links a:hover {
            color: var(--neon-blue);
            background: rgba(0, 229, 255, 0.1);
        }
        .nav-links a.active {
            color: var(--neon-green);
            background: rgba(0, 255, 136, 0.1);
        }
        
        .banca-hero {
            background: linear-gradient(135deg, rgba(0, 255, 136, 0.1) 0%, rgba(20, 25, 35, 0.8) 100%);
            border: 1px solid var(--neon-green);
            padding: 2rem;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 2rem;
        }
        .banca-value {
            font-size: 3rem;
            font-weight: 700;
            color: var(--neon-green);
            margin: 10px 0;
            text-shadow: 0 0 20px rgba(0, 255, 136, 0.4);
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1rem;
            margin-bottom: 2rem;
        }
        
        .history-table {
            width: 100%;
            border-collapse: collapse;
            background: var(--glass-bg);
            border-radius: 12px;
            overflow: hidden;
        }
        .history-table th, .history-table td {
            padding: 12px 16px;
            text-align: left;
            border-bottom: 1px solid var(--glass-border);
        }
        .history-table th {
            background: rgba(0,0,0,0.2);
            color: var(--text-muted);
            font-weight: 600;
        }
        .badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: 700;
        }
        .badge.vencida { background: rgba(0, 255, 136, 0.2); color: var(--neon-green); }
        .badge.perdida { background: rgba(255, 51, 102, 0.2); color: var(--alert-red); }
        .badge.pendente { background: rgba(255, 170, 0, 0.2); color: #ffaa00; }
        
        .action-btn {
            background: transparent;
            border: 1px solid var(--text-muted);
            color: var(--text-main);
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .action-btn:hover { background: rgba(255,255,255,0.1); }
        .action-btn.win:hover { background: rgba(0, 255, 136, 0.2); border-color: var(--neon-green); color: var(--neon-green); }
        .action-btn.loss:hover { background: rgba(255, 51, 102, 0.2); border-color: var(--alert-red); color: var(--alert-red); }
    </style>
</head>
<body>
    <div class="app-container">
        <header class="glass-header" style="flex-direction: column; align-items: flex-start;">
            <div style="display: flex; justify-content: space-between; width: 100%;">
                <div class="logo">
                    <span class="neon-dot"></span>
                    <h1>Market Monitor PRO</h1>
                </div>
            </div>
            <nav class="nav-links">
                <a href="/">🔴 Ao Vivo (Radar)</a>
                <a href="/pre-jogo">📅 Radar Pré-Jogo</a>
                <a href="/banca" class="active">💰 Gestão de Banca</a>
            </nav>
        </header>

        <main>
            <div class="banca-hero">
                <div style="color: var(--text-muted); font-weight: 600;">BANCA ATUAL</div>
                <div class="banca-value" id="banca-atual">R$ 0,00</div>
                <div style="color: var(--text-muted);">Banca Inicial: <span id="banca-inicial">R$ 0,00</span></div>
            </div>
            
            <div class="stats-grid">
                <div class="stat-box glass-panel">
                    <span class="stat-label">Lucro Total</span>
                    <span class="stat-value" id="lucro-total" style="font-size: 1.5rem;">R$ 0,00</span>
                </div>
                <div class="stat-box glass-panel">
                    <span class="stat-label">ROI (Retorno)</span>
                    <span class="stat-value" id="roi" style="font-size: 1.5rem;">0%</span>
                </div>
                <div class="stat-box glass-panel">
                    <span class="stat-label">Win Rate</span>
                    <span class="stat-value" id="win-rate" style="font-size: 1.5rem;">0%</span>
                </div>
                <div class="stat-box glass-panel">
                    <span class="stat-label">Apostas Realizadas</span>
                    <span class="stat-value" id="total-apostas" style="font-size: 1.5rem;">0</span>
                </div>
            </div>
            
            <div class="section-title">
                <h2>Histórico de Apostas</h2>
            </div>
            
            <table class="history-table">
                <thead>
                    <tr>
                        <th>Data</th>
                        <th>Partida</th>
                        <th>Odd</th>
                        <th>Stake</th>
                        <th>Lucro/Perda</th>
                        <th>Status</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="history-body">
                    <tr><td colspan="7" style="text-align: center;">Carregando...</td></tr>
                </tbody>
            </table>
        </main>
    </div>

    <script>
        function formatCurrency(val) {
            return 'R$ ' + val.toFixed(2).replace('.', ',');
        }

        async function fetchBanca() {
            const response = await fetch('/api/banca');
            const data = await response.json();
            
            document.getElementById('banca-atual').innerText = formatCurrency(data.banca_atual);
            document.getElementById('banca-inicial').innerText = formatCurrency(data.banca_inicial);
            
            const lucroEl = document.getElementById('lucro-total');
            lucroEl.innerText = formatCurrency(data.lucro_total);
            lucroEl.style.color = data.lucro_total >= 0 ? 'var(--neon-green)' : 'var(--alert-red)';
            
            const roiEl = document.getElementById('roi');
            roiEl.innerText = data.roi.toFixed(1) + '%';
            roiEl.style.color = data.roi >= 0 ? 'var(--neon-green)' : 'var(--alert-red)';
            
            document.getElementById('win-rate').innerText = data.win_rate.toFixed(1) + '%';
            document.getElementById('total-apostas').innerText = data.total_apostas;
            
            const tbody = document.getElementById('history-body');
            tbody.innerHTML = '';
            
            if (data.apostas.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" style="text-align: center;">Nenhuma aposta registrada ainda.</td></tr>';
                return;
            }
            
            data.apostas.forEach(a => {
                let lucroStr = formatCurrency(a.lucro);
                if (a.lucro > 0) lucroStr = '<span style="color:var(--neon-green)">+' + lucroStr + '</span>';
                else if (a.lucro < 0) lucroStr = '<span style="color:var(--alert-red)">' + lucroStr + '</span>';
                else if (a.status === 'pendente') lucroStr = '—';
                
                let acoes = '—';
                if (a.status === 'pendente') {
                    acoes = `
                        <button class="action-btn win" onclick="resolver(${a.id}, 'vencida')">✅ Green</button>
                        <button class="action-btn loss" onclick="resolver(${a.id}, 'perdida')">❌ Red</button>
                    `;
                }
                
                tbody.innerHTML += `
                    <tr>
                        <td>${a.data.split(' ')[1]}</td>
                        <td>${a.partida}<br><small style="color:var(--text-muted)">${a.mercado}</small></td>
                        <td>@${a.odd.toFixed(2)}</td>
                        <td>${formatCurrency(a.stake)}</td>
                        <td>${lucroStr}</td>
                        <td><span class="badge ${a.status}">${a.status.toUpperCase()}</span></td>
                        <td>${acoes}</td>
                    </tr>
                `;
            });
        }

        async function resolver(id, status) {
            await fetch('/api/banca/resolver', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id, status })
            });
            fetchBanca();
        }

        fetchBanca();
    </script>
</body>
</html>
